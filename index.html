<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedikúra Erika Svobodová</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&family=Parisienne&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Montserrat',sans-serif;
background:#ffffff;
color:#444;
overflow-x:hidden;
}

header{
position:fixed;
top:0;
left:0;
width:100%;
padding:16px 7%;
display:flex;
justify-content:space-between;
align-items:center;
background:#f6dede;
z-index:1000;
box-shadow:0 4px 20px rgba(0,0,0,0.04);
}

.logo{
display:flex;
align-items:center;
}

.logo img{
height:140px;
width:auto;
object-fit:contain;
}

nav{
display:flex;
align-items:center;
gap:28px;
flex-wrap:wrap;
}

nav a{
text-decoration:none;
font-size:13px;
text-transform:uppercase;
letter-spacing:1px;
color:#444;
font-weight:600;
transition:0.3s;
}

nav a:hover{
color:#d57c87;
}

.top-btn{
background:#d57c87;
color:white;
padding:15px 28px;
border-radius:50px;
text-decoration:none;
font-size:13px;
font-weight:600;
margin-left:15px;
transition:0.3s;
}

.top-btn:hover{
background:#c56a76;
}

.hero{
min-height:100vh;
display:grid;
grid-template-columns:1fr 1fr;
align-items:center;
padding:180px 7% 90px;
background:#fcf7f5;
}

.hero-left{
padding-right:60px;
}

.script{
font-family:'Parisienne',cursive;
font-size:88px;
color:#df8f99;
line-height:1;
}

.hero h1{
font-family:'Cormorant Garamond',serif;
font-size:92px;
font-weight:500;
line-height:0.95;
margin-top:10px;
color:#2d2d2d;
}

.divider{
width:220px;
height:1px;
background:#e7b0b7;
margin:35px 0;
position:relative;
}

.divider::after{
content:'♥';
position:absolute;
left:50%;
top:-11px;
transform:translateX(-50%);
background:#fcf7f5;
padding:0 12px;
color:#df8f99;
}

.hero p{
font-size:24px;
line-height:1.8;
max-width:540px;
margin-bottom:45px;
color:#666;
}

.main-btn{
display:inline-block;
background:#d57c87;
color:white;
padding:20px 38px;
border-radius:60px;
text-decoration:none;
font-weight:600;
}

.hero-right img{
width:100%;
border-radius:0 0 0 140px;
}

.features{
display:grid;
grid-template-columns:repeat(4,1fr);
padding:42px 7%;
background:white;
text-align:center;
gap:20px;
}

.feature h3{
font-family:'Cormorant Garamond',serif;
font-size:32px;
color:#d57c87;
margin-bottom:8px;
}

.feature p{
color:#666;
}

footer{
padding:40px;
background:#f6dede;
text-align:center;
font-size:13px;
color:#666;
margin-top:50px;
}

.footer-logo img{
height:90px;
margin-bottom:15px;
}

@media(max-width:1200px){

.hero{
grid-template-columns:1fr;
text-align:center;
}

.hero-left{
padding-right:0;
margin-bottom:60px;
}

.divider{
margin:35px auto;
}

.features{
grid-template-columns:1fr 1fr;
}

}

@media(max-width:700px){

header{
flex-direction:column;
gap:20px;
padding:20px;
}

.logo img{
height:100px;
}

nav{
justify-content:center;
gap:16px;
}

.hero{
padding-top:240px;
}

.hero h1{
font-size:60px;
}

.script{
font-size:60px;
}

.features{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
<img src="logo.png" alt="Logo">
</div>

<nav>

<a href="index.html">Úvod</a>
<a href="#sluzby">Služby</a>
<a href="cenik.html">Ceník</a>
<a href="#">Galerie</a>
<a href="#objednani">Objednat termín</a>
<a href="#kontakt">Kontakt</a>

<a class="top-btn" href="#objednani">
OBJEDNAT TERMÍN
</a>

</nav>

</header>

<section class="hero">

<div class="hero-left">

<div class="script">
Pedikúra
</div>

<h1>
Erika Svobodová
</h1>

<div class="divider"></div>

<p>
Dopřejte svým nohám péči, kterou si zaslouží.
</p>

<a href="#objednani" class="main-btn">
OBJEDNAT TERMÍN
</a>

</div>

<div class="hero-right">

<img src="https://images.unsplash.com/photo-1519014816548-bf5fe059798b?q=80&w=1800&auto=format&fit=crop">

</div>

</section>

<section class="features">

<div class="feature">
<h3>PÉČE</h3>
<p>s láskou</p>
</div>

<div class="feature">
<h3>KVALITA</h3>
<p>na prvním místě</p>
</div>

<div class="feature">
<h3>POHODA</h3>
<p>a relaxace</p>
</div>

<div class="feature">
<h3>ZDRAVÉ</h3>
<p>a krásné nohy</p>
</div>

</section>

<footer>

<div class="footer-logo">
<img src="logo.png" alt="Logo">
</div>

© 2026 Pedikúra Erika Svobodová. Všechna práva vyhrazena.

</footer>

</body>
</html>
